name: oneoff-q00-proof-safe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-q00-proof-safe.yml'

jobs:
  proof-producing-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate governed workspace
        run: |
          python scripts/cruthunas.py check --all
          python scripts/cruthunas.py adapters check
          python scripts/validate_cruthunas_transactions.py
          make validate

      - name: Generate compact q00 CNF
        working-directory: borsuk_11_k6_four_base_reduction
        run: |
          python build_instance.py q00 --output-dir work/q00
          python verify_sat_lane.py

      - name: Build pinned Kissat and independent checker
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://zenodo.org/records/13081405/files/arminbiere/kissat-rel-4.0.0.zip?download=1' \
            --output /tmp/kissat-rel-4.0.0.zip
          echo '89801fadc6d7a2ee1519a9cccf0c9029  /tmp/kissat-rel-4.0.0.zip' | md5sum --check --strict
          rm -rf /tmp/kissat-source
          mkdir /tmp/kissat-source
          unzip -q /tmp/kissat-rel-4.0.0.zip -d /tmp/kissat-source
          configure_path="$(find /tmp/kissat-source -type f -name configure | head -n 1)"
          test -n "$configure_path"
          source_dir="$(dirname "$configure_path")"
          cd "$source_dir"
          ./configure
          make -j2
          cp build/kissat /tmp/kissat-4.0.0
          /tmp/kissat-4.0.0 --version | tee "$GITHUB_WORKSPACE/borsuk_11_k6_four_base_reduction/work/q00/solver-version.txt"
          sha256sum /tmp/kissat-4.0.0 | tee "$GITHUB_WORKSPACE/borsuk_11_k6_four_base_reduction/work/q00/solver-binary.sha256"
          g++ -O3 -std=c++17 \
            "$GITHUB_WORKSPACE/borsuk_11_k6_trim_unsat_certificate/drup_check.cpp" \
            -o /tmp/drup_check
          sha256sum /tmp/drup_check | tee "$GITHUB_WORKSPACE/borsuk_11_k6_four_base_reduction/work/q00/checker-binary.sha256"

      - name: Produce textual DRUP-compatible proof and check it
        working-directory: borsuk_11_k6_four_base_reduction
        shell: bash
        run: |
          set -u
          work=work/q00
          cnf="$work/q00_12color.cnf"
          proof="$work/q00.drat"
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          timeout --signal=TERM --kill-after=10s 900 \
            /tmp/kissat-4.0.0 \
              --no-binary \
              --no-compress \
              --no-eliminate \
              --no-probe \
              --no-substitute \
              --no-vivify \
              "$cnf" "$proof" \
            >"$work/solver.out" 2>"$work/solver.err"
          solver_status=$?
          set -e

          state=UNKNOWN
          checker_status=-1
          if [ "$solver_status" -eq 20 ] && [ -s "$proof" ]; then
            set +e
            timeout --signal=TERM --kill-after=10s 900 \
              /tmp/drup_check "$cnf" "$proof" \
              >"$work/checker.out" 2>"$work/checker.err"
            checker_status=$?
            set -e
            cat "$work/checker.out"
            cat "$work/checker.err" >&2
            if [ "$checker_status" -eq 0 ] && grep -q 'VERIFIED UNSAT' "$work/checker.out"; then
              state=UNSAT_PROOF_VERIFIED
            else
              state=UNSAT_PROOF_REJECTED
            fi
          elif [ "$solver_status" -eq 10 ]; then
            python verify_model.py q00 "$work/solver.out" \
              --output "$work/q00_verified_coloring.json" \
              | tee "$work/checker.out"
            checker_status=0
            state=SAT_MODEL_VERIFIED
          fi

          finished="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -s "$proof" ]; then
            gzip -9 "$proof"
          fi
          export SOLVER_STATUS="$solver_status"
          export CHECKER_STATUS="$checker_status"
          export RESULT_STATE="$state"
          export STARTED_UTC="$started"
          export FINISHED_UTC="$finished"
          python - "$work/proof-result.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              'schema': 'borsuk-proof-producing-run-v1',
              'case_id': 'q00',
              'claim_id': 'n11-k6-four-base-reduction',
              'encoding': 'compact-list-color-v2',
              'proof_mode': 'textual-drup-compatible-kissat',
              'solver_limit_seconds': 900,
              'checker_limit_seconds': 900,
              'solver_exit_status': int(os.environ['SOLVER_STATUS']),
              'checker_exit_status': int(os.environ['CHECKER_STATUS']),
              'state': os.environ['RESULT_STATE'],
              'started_utc': os.environ['STARTED_UTC'],
              'finished_utc': os.environ['FINISHED_UTC'],
              'repository_status_changed': False,
              'cruthunas_state': 'PROBE_ONLY_UNTIL_ARTIFACT_IMPORT',
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          sha256sum "$work"/* >"$work/artifact-sha256.txt"
          case "$state" in
            UNSAT_PROOF_VERIFIED|SAT_MODEL_VERIFIED) exit 0 ;;
            *) exit 1 ;;
          esac

      - name: Upload proof-run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q00-proof-safe-run
          path: borsuk_11_k6_four_base_reduction/work/q00/
          if-no-files-found: error
          retention-days: 30
