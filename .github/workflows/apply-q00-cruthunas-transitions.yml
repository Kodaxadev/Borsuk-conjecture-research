name: apply-q00-cruthunas-transitions

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-q00-cruthunas-transitions.yml

permissions:
  contents: write

concurrency:
  group: apply-q00-cruthunas-transitions
  cancel-in-progress: false

jobs:
  register-q00-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout governed branch directly
        uses: actions/checkout@v4
        with:
          ref: research-workspace-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure serialized writer
        run: |
          set -euo pipefail
          git config user.name 'cruthunas-transition-bot'
          git config user.email 'cruthunas-transition-bot@users.noreply.github.com'
          git pull --ff-only origin research-workspace-hardening
          test -z "$(git status --porcelain)"

      - name: Freeze unchanged theorem and case boundaries
        run: |
          set -euo pipefail
          sha256sum borsuk_11_k6_four_base_reduction/case_status.json \
            > "$RUNNER_TEMP/case-status.before.sha256"
          python - <<'PY' > "$RUNNER_TEMP/theorem.before.json"
          import json
          from pathlib import Path
          claims = json.loads(Path('research/claims.json').read_text())
          ledger = json.loads(Path('cruthunas/ledger.json').read_text())
          claim = next(item for item in claims['claims'] if item['id'] == 'n11-k6-full')
          entry = next(item for item in ledger['entries'] if item['claim_id'] == 'n11-k6-full')
          print(json.dumps({
              'claim_status': claim['status'],
              'gate': entry['gate'],
              'epistemic_class': entry['epistemic_class'],
              'verification_state': entry['verification_state'],
              'lifecycle_state': entry['lifecycle_state'],
              'current_transition_id': entry['current_transition_id'],
          }, sort_keys=True))
          PY
          cat "$RUNNER_TEMP/theorem.before.json"

      - name: Validate current governance baseline
        run: |
          set -euo pipefail
          python scripts/cruthunas.py status
          python scripts/validate_claims.py
          python scripts/cruthunas.py check --all
          python scripts/cruthunas.py adapters check
          python scripts/validate_cruthunas_transactions.py
          python scripts/validate_cruthunas_observations.py
          make verify

      - name: Register q00 claim at Gate 2
        run: |
          set -euo pipefail
          git pull --ff-only origin research-workspace-hardening
          python scripts/register_q00_certificate_claim.py scoped
          python scripts/validate_claims.py
          python scripts/cruthunas.py check --all
          python scripts/cruthunas.py adapters check
          python scripts/validate_cruthunas_transactions.py
          python scripts/validate_cruthunas_observations.py
          make verify
          git add research/claims.json cruthunas
          git diff --cached --check
          git commit -m 'Register scoped q00 UNSAT claim at Cruthunas Gate 2'
          git push origin HEAD:research-workspace-hardening

      - name: Validate and apply Gate 2 to Gate 3
        run: |
          set -euo pipefail
          git pull --ff-only origin research-workspace-hardening
          python scripts/validate_cruthunas_transactions.py
          python scripts/register_q00_certificate_claim.py gate3
          python scripts/validate_claims.py
          python scripts/cruthunas.py check --all
          python scripts/cruthunas.py adapters check
          python scripts/validate_cruthunas_transactions.py
          python scripts/validate_cruthunas_observations.py
          make verify
          git add research/claims.json cruthunas
          git diff --cached --check
          git commit -m 'Link q00 certificate evidence at Cruthunas Gate 3'
          git push origin HEAD:research-workspace-hardening

      - name: Validate and apply explicit Gate 3 to Gate 4
        run: |
          set -euo pipefail
          git pull --ff-only origin research-workspace-hardening
          python scripts/validate_cruthunas_transactions.py
          python scripts/register_q00_certificate_claim.py gate4
          python scripts/validate_claims.py
          python scripts/cruthunas.py check --all
          python scripts/cruthunas.py adapters check
          python scripts/validate_cruthunas_transactions.py
          python scripts/validate_cruthunas_observations.py
          make verify
          git add research/claims.json cruthunas
          git diff --cached --check
          git commit -m 'Register q00 UNSAT certificate as Gate 4 obstruction'
          git push origin HEAD:research-workspace-hardening

      - name: Verify final scoped state and unchanged boundaries
        run: |
          set -euo pipefail
          git pull --ff-only origin research-workspace-hardening
          test -z "$(git status --porcelain)"
          python scripts/validate_claims.py
          python scripts/cruthunas.py check --all
          python scripts/cruthunas.py adapters check
          python scripts/validate_cruthunas_transactions.py
          python scripts/validate_cruthunas_observations.py
          make verify
          make status
          sha256sum --check "$RUNNER_TEMP/case-status.before.sha256"
          python - <<'PY' > "$RUNNER_TEMP/theorem.after.json"
          import json
          from pathlib import Path
          claims = json.loads(Path('research/claims.json').read_text())
          ledger = json.loads(Path('cruthunas/ledger.json').read_text())
          claim = next(item for item in claims['claims'] if item['id'] == 'n11-k6-full')
          entry = next(item for item in ledger['entries'] if item['claim_id'] == 'n11-k6-full')
          q00 = next(item for item in ledger['entries'] if item['claim_id'] == 'n11-k6-q00-trim-unsat')
          print(json.dumps({
              'theorem': {
                  'claim_status': claim['status'],
                  'gate': entry['gate'],
                  'epistemic_class': entry['epistemic_class'],
                  'verification_state': entry['verification_state'],
                  'lifecycle_state': entry['lifecycle_state'],
                  'current_transition_id': entry['current_transition_id'],
              },
              'q00_obstruction': {
                  'gate': q00['gate'],
                  'epistemic_class': q00['epistemic_class'],
                  'verification_state': q00['verification_state'],
                  'lifecycle_state': q00['lifecycle_state'],
                  'current_transition_id': q00['current_transition_id'],
              },
          }, sort_keys=True))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path("${{ runner.temp }}/theorem.before.json").read_text())
          after = json.loads(Path("${{ runner.temp }}/theorem.after.json").read_text())
          if after['theorem'] != before:
              raise SystemExit(f"n11-k6-full changed: before={before} after={after['theorem']}")
          expected = {
              'gate': 4,
              'epistemic_class': 'COMPUTATIONAL',
              'verification_state': 'CERTIFICATE_CHECKED',
              'lifecycle_state': 'WORKING',
              'current_transition_id': 'T-K6-Q00-3-4',
          }
          if after['q00_obstruction'] != expected:
              raise SystemExit(f"unexpected q00 state: {after['q00_obstruction']}")
          print(json.dumps(after, indent=2, sort_keys=True))
          PY
