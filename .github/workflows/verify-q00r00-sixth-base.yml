name: verify-q00r00-sixth-base

on:
  push:
    branches:
      - research/q00r00-sixth-base-refinement
  pull_request:
    paths:
      - 'borsuk_11_k6_q00r00_sixth_base_refinement/**'
      - '.github/workflows/verify-q00r00-sixth-base.yml'

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently reproduce classification
        working-directory: borsuk_11_k6_q00r00_sixth_base_refinement
        run: python verify_package.py
      - name: Upload complete certificates
        uses: actions/upload-artifact@v4
        with:
          name: q00r00-sixth-base-classification
          path: borsuk_11_k6_q00r00_sixth_base_refinement/generated/
          if-no-files-found: error
          retention-days: 90
