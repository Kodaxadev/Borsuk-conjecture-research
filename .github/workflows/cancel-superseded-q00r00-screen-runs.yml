name: cancel-superseded-q00r00-screen-runs

on:
  push:
    branches:
      - research/q00r00-sixth-base-colorability-screen
    paths:
      - '.github/workflows/cancel-superseded-q00r00-screen-runs.yml'

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/q00r00-sixth-base-colorability-screen
          fetch-depth: 0

      - name: Cancel superseded active screen runs
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITATIVE_SHA: cca43b17354619afd473c835d63f363a16cae5bf
          SCREEN_WORKFLOW: screen-q00r00-sixth-base-colorability.yml
        run: |
          set -euo pipefail
          branch='research/q00r00-sixth-base-colorability-screen'
          encoded_branch='research%2Fq00r00-sixth-base-colorability-screen'
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$SCREEN_WORKFLOW/runs?branch=$encoded_branch&event=push&per_page=100"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" > /tmp/screen-runs.json

          python - <<'PY' > /tmp/cancel-ids.txt
          import json, os
          data=json.load(open('/tmp/screen-runs.json'))
          active={'queued','in_progress','waiting','requested','pending'}
          authoritative=os.environ['AUTHORITATIVE_SHA']
          for run in data.get('workflow_runs', []):
              if run.get('status') in active and run.get('head_sha') != authoritative:
                  print(run['id'])
          PY

          : > /tmp/cancel-results.tsv
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            set +e
            http_status="$(curl --silent --show-error --output /tmp/cancel-response.json --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel")"
            curl_status=$?
            set -e
            printf '%s\t%s\t%s\n' "$run_id" "$curl_status" "$http_status" >> /tmp/cancel-results.tsv
          done < /tmp/cancel-ids.txt

          mkdir -p operations
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          runs=json.load(open('/tmp/screen-runs.json')).get('workflow_runs', [])
          requested=[]
          path=Path('/tmp/cancel-results.tsv')
          if path.exists():
              for line in path.read_text().splitlines():
                  run_id, curl_status, http_status=line.split('\t')
                  requested.append({
                      'run_id': int(run_id),
                      'curl_exit_status': int(curl_status),
                      'http_status': int(http_status),
                      'cancel_request_accepted': int(curl_status)==0 and int(http_status) in {202,409},
                  })
          report={
              'schema':'borsuk-q00r00-screen-superseded-run-cancellation-v1',
              'workflow':'screen-q00r00-sixth-base-colorability.yml',
              'branch':'research/q00r00-sixth-base-colorability-screen',
              'authoritative_sha':os.environ['AUTHORITATIVE_SHA'],
              'recorded_utc':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'observed_runs':[
                  {'run_id':r['id'],'head_sha':r['head_sha'],'status':r['status'],'conclusion':r.get('conclusion')}
                  for r in runs
              ],
              'cancel_requests':requested,
          }
          Path('operations/q00r00-sixth-base-screen-cancellation.json').write_text(
              json.dumps(report, indent=2, sort_keys=True)+'\n', encoding='utf-8'
          )
          PY

      - name: Commit cancellation report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operations/q00r00-sixth-base-screen-cancellation.json
          git diff --cached --check
          git commit -m 'Record superseded q00r00 screen run cancellation'
          git push origin HEAD:research/q00r00-sixth-base-colorability-screen
