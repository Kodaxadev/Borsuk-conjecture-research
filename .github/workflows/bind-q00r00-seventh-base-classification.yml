name: bind-q00r00-seventh-base-classification

on:
  push:
    branches:
      - research/q00r00-seventh-base-classification
    paths:
      - '.github/workflows/bind-q00r00-seventh-base-classification.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: bind-q00r00-seventh-base-classification
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: research/q00r00-seventh-base-classification
      PACKAGE: borsuk_11_k6_q00r00_seventh_base_classification
      RUN_ID: '30875846299'
      RUN_ATTEMPT: '1'
      JOB_ID: '91887027074'
      ARTIFACT_ID: '8879504727'
      ARTIFACT_NAME: q00r00-seventh-base-classification
      ARTIFACT_SIZE: '583069'
      ARTIFACT_CREATED_AT: '2026-08-04T03:50:22Z'
      ARTIFACT_EXPIRES_AT: '2026-11-02T03:49:43Z'
      ARTIFACT_SHA256: dece0e924900b2bd751a62e82edca7e59f55e0c58a5bf92c5b9b196755646352
      WORKFLOW_REVISION: eb3f921983946b2ab8fa930fbec4f08c0133d3ac
      CLASSIFIED_SOURCE_SHA: bdcd88d18a01e383aa30aac401c083d8775e2ca2
      CLASSIFICATION_STREAM_SHA256: 932c4ed2ffc689ce5b5fe5cea07eec9876734159186df70b598b6f3ec316f6de
      GRANDCHILDREN_CSV_SHA256: 87114d943baf132abc74502de2bac9655882d00b4c27fe13358566e930284b27
      SUMMARY_SHA256: c0ac1d4464223aa09d2a4f4f8c9fb82d00eb7aa837cef8c297b8bfc8003417b8
      INDEPENDENT_VERIFICATION_SHA256: be463122580fbb9b8e9e5520e64a772a0a36aa8792e87ed297eafbbfc874062f
      VERIFICATION_SHA256: 8300cd357a23e76a96b0a42a4fb05c49d4a7988e56506ce747fba86984063705
      SHA256SUMS_SHA256: 78936099c5024ba0e01f275746be84e36ce24740edfb0c5e2874d7ee0cd9964e
    steps:
      - name: Checkout binder revision
        uses: actions/checkout@v4
        with:
          ref: research/q00r00-seventh-base-classification
          fetch-depth: 0
          persist-credentials: true

      - name: Configure serialized writer
        run: |
          set -euo pipefail
          git config user.name 'classification-binding-bot'
          git config user.email 'classification-binding-bot@users.noreply.github.com'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Download and independently verify artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence="$PACKAGE/evidence/run-$RUN_ID"
          archive_dir="$evidence/artifacts"
          archive="$archive_dir/q00r00-seventh-base-classification-run-$RUN_ID.zip"
          extract="$RUNNER_TEMP/classification-artifact"
          mkdir -p "$archive_dir" "$extract"

          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$archive"

          test "$(stat -c '%s' "$archive")" = "$ARTIFACT_SIZE"
          echo "$ARTIFACT_SHA256  $archive" | sha256sum --check --strict
          printf '%s  %s\n' "$ARTIFACT_SHA256" "$(basename "$archive")" > "$archive.sha256"

          unzip -q "$archive" -d "$extract"
          test "$(find "$extract" -type f | wc -l)" -eq 41
          test "$(du -sb "$extract" | awk '{print $1}')" -ge 5096221
          (cd "$extract" && sha256sum --check --strict SHA256SUMS)

          test "$(sha256sum "$extract/grandchildren.csv" | awk '{print $1}')" = "$GRANDCHILDREN_CSV_SHA256"
          test "$(sha256sum "$extract/summary.json" | awk '{print $1}')" = "$SUMMARY_SHA256"
          test "$(sha256sum "$extract/independent-verification.json" | awk '{print $1}')" = "$INDEPENDENT_VERIFICATION_SHA256"
          test "$(sha256sum "$extract/verification.json" | awk '{print $1}')" = "$VERIFICATION_SHA256"
          test "$(sha256sum "$extract/SHA256SUMS" | awk '{print $1}')" = "$SHA256SUMS_SHA256"

          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'classification-artifact'
          summary=json.loads((root/'summary.json').read_text())
          verification=json.loads((root/'verification.json').read_text())
          independent=json.loads((root/'independent-verification.json').read_text())
          expected_stream=os.environ['CLASSIFICATION_STREAM_SHA256']
          assert summary['status']=='PASS'
          assert verification['status']=='PASS'
          assert independent['status']=='PASS'
          assert summary['classification_stream_sha256']==expected_stream
          assert verification['classification']['classification_stream_sha256']==expected_stream
          assert independent['classification_stream_sha256']==expected_stream
          assert summary['child_count']==36
          assert summary['candidate_count_total']==10297
          assert summary['grandchild_count']==4476
          assert summary['pointwise_orbit_count_negative_control_total']==8483
          assert summary['complexity_tier_counts']=={'PILOT':15,'SMALL':816,'MEDIUM':2573,'LARGE':1072}
          assert summary['status_boundary']=={
              'all_grandchildren':'UNKNOWN',
              'n11-k6-full':'Gate 2 / OPEN',
              'q00':'UNKNOWN',
              'q00r00':'UNKNOWN',
              'q00r00_s000_through_s035':'UNKNOWN',
          }
          assert verification['refinement_boundary']['all_36_inputs_are_incomplete_screen_cases'] is True
          assert verification['refinement_boundary']['certified_obstruction_frontier_count']==0
          assert verification['refinement_boundary']['cross_child_merging_performed'] is False
          assert verification['refinement_boundary']['recanonicalization_across_children_performed'] is False
          assert len(summary['pilot_cases'])==15
          PY

      - name: Commit execution evidence
        run: |
          set -euo pipefail
          evidence="$PACKAGE/evidence/run-$RUN_ID"
          archive_rel="$evidence/artifacts/q00r00-seventh-base-classification-run-$RUN_ID.zip"
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          p=Path(os.environ['PACKAGE'])/'evidence'/f"run-{os.environ['RUN_ID']}"/'EXECUTION_BINDING.json'
          p.parent.mkdir(parents=True, exist_ok=True)
          record={
            'schema':'borsuk-q00r00-seventh-base-classification-execution-binding-v1',
            'claim_id':'n11-k6-q00r00-seventh-base-classification',
            'workflow':{
              'name':'verify-q00r00-seventh-base-classification',
              'path':'.github/workflows/verify-q00r00-seventh-base-classification.yml',
              'run_id':int(os.environ['RUN_ID']),
              'run_attempt':int(os.environ['RUN_ATTEMPT']),
              'workflow_revision':os.environ['WORKFLOW_REVISION'],
              'classified_source_sha':os.environ['CLASSIFIED_SOURCE_SHA'],
              'branch':'research/q00r00-seventh-base-classification',
            },
            'job':{
              'id':int(os.environ['JOB_ID']),
              'name':'classify-and-verify',
              'conclusion':'success',
              'required_steps':{
                'Checkout frozen classification source':'success',
                'Verify governed input boundary':'success',
                'Extract execution-bound child trims':'success',
                'Generate canonical seventh-base classification':'success',
                'Independently reproduce classification':'success',
                'Verify frozen package and negative control':'success',
                'Upload complete classification certificate':'success',
              },
            },
            'artifact':{
              'id':int(os.environ['ARTIFACT_ID']),
              'name':os.environ['ARTIFACT_NAME'],
              'size_bytes':int(os.environ['ARTIFACT_SIZE']),
              'created_at':os.environ['ARTIFACT_CREATED_AT'],
              'expires_at':os.environ['ARTIFACT_EXPIRES_AT'],
              'github_digest':'sha256:'+os.environ['ARTIFACT_SHA256'],
              'downloaded_archive_sha256':os.environ['ARTIFACT_SHA256'],
              'downloaded_archive_verified':True,
              'repository_archive_path':f"{os.environ['PACKAGE']}/evidence/run-{os.environ['RUN_ID']}/artifacts/q00r00-seventh-base-classification-run-{os.environ['RUN_ID']}.zip",
              'file_count':41,
              'uncompressed_bytes':5096221,
              'all_internal_checksums_verified':True,
            },
            'frozen_outputs':{
              'classification_stream_sha256':os.environ['CLASSIFICATION_STREAM_SHA256'],
              'grandchildren_csv_sha256':os.environ['GRANDCHILDREN_CSV_SHA256'],
              'summary_sha256':os.environ['SUMMARY_SHA256'],
              'independent_verification_sha256':os.environ['INDEPENDENT_VERIFICATION_SHA256'],
              'verification_sha256':os.environ['VERIFICATION_SHA256'],
              'sha256sums_sha256':os.environ['SHA256SUMS_SHA256'],
              'child_count':36,
              'candidate_count_total':10297,
              'grandchild_count':4476,
              'pointwise_negative_control_count':8483,
              'pilot_case_count':15,
            },
            'mathematical_status':{
              'q00r00_s000_through_s035':'UNKNOWN',
              'all_4476_grandchildren':'UNKNOWN',
              'q00r00':'UNKNOWN',
              'q00':'UNKNOWN',
              'n11-k6-full':'Gate 2 / OPEN',
            },
            'refinement_boundary':{
              'reason':'incomplete_screen_not_certified_obstruction',
              'certified_obstruction_frontier_count':0,
              'cross_child_merging_performed':False,
              'recanonicalization_across_children_performed':False,
            },
            'recorded_at':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
          }
          p.write_text(json.dumps(record,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git add "$evidence"
          git diff --cached --check
          git commit -m 'Archive and bind seventh-base classification execution'
          git push origin HEAD:"$BRANCH"
          echo "EXECUTION_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "EXECUTION_BINDING_SHA256=$(sha256sum "$evidence/EXECUTION_BINDING.json" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Commit repository governance binding
        run: |
          set -euo pipefail
          git pull --ff-only origin "$BRANCH"
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          p=Path(os.environ['PACKAGE'])/'evidence'/f"run-{os.environ['RUN_ID']}"/'GOVERNANCE_BINDING.json'
          pilot=[
            'q00r00-s026-t066','q00r00-s028-t116','q00r00-s028-t144','q00r00-s028-t148','q00r00-s028-t154',
            'q00r00-s030-t084','q00r00-s030-t086','q00r00-s031-t041','q00r00-s033-t084','q00r00-s034-t025',
            'q00r00-s034-t028','q00r00-s034-t033','q00r00-s034-t034','q00r00-s034-t035','q00r00-s035-t008',
          ]
          record={
            'schema':'borsuk-q00r00-seventh-base-classification-governance-binding-v1',
            'claim_id':'n11-k6-q00r00-seventh-base-classification',
            'execution_evidence_commit':os.environ['EXECUTION_COMMIT'],
            'execution_binding_sha256':os.environ['EXECUTION_BINDING_SHA256'],
            'workflow_revision':os.environ['WORKFLOW_REVISION'],
            'classified_source_sha':os.environ['CLASSIFIED_SOURCE_SHA'],
            'run_id':int(os.environ['RUN_ID']),
            'artifact_id':int(os.environ['ARTIFACT_ID']),
            'artifact_sha256':os.environ['ARTIFACT_SHA256'],
            'status':[
              'COMPUTATIONAL','DUAL_IMPLEMENTATION_REPRODUCED','CI_EXECUTION_COMPLETE',
              'ARTIFACT_ARCHIVES_VERIFIED','EXECUTION_BOUND','REPOSITORY_GOVERNED','WORKING',
            ],
            'classification':{
              'sixth_base_inputs':36,
              'compatible_seventh_candidates':10297,
              'canonical_grandchildren':4476,
              'pointwise_negative_control_cases':8483,
              'pilot_cases':15,
              'classification_stream_sha256':os.environ['CLASSIFICATION_STREAM_SHA256'],
            },
            'mathematical_status':{
              'q00r00_s000_through_s035':'UNKNOWN',
              'all_4476_grandchildren':'UNKNOWN',
              'q00r00':'UNKNOWN',
              'q00':'UNKNOWN',
              'n11-k6-full':'Gate 2 / OPEN',
            },
            'next_governed_work_unit':{
              'claim_id':'n11-k6-q00r00-seventh-base-colorability-pilot',
              'scope':'one-sided 12-colorability screen of exactly 15 frozen PILOT grandchildren',
              'pilot_cases':pilot,
              'result_classes':{
                'SAT_CHECKED_COLORING':'grandchild closed',
                'PROOF_CHECKED_UNSAT':'certified eighth-base refinement frontier',
                'UNKNOWN':'incomplete pilot case',
              },
              'parent_closure_not_implied':True,
            },
            'recorded_at':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
          }
          p.write_text(json.dumps(record,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git add "$PACKAGE/evidence/run-$RUN_ID/GOVERNANCE_BINDING.json"
          git diff --cached --check
          git commit -m 'Govern seventh-base classification execution evidence'
          git push origin HEAD:"$BRANCH"
          echo "GOVERNANCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Synchronize package status
        run: |
          set -euo pipefail
          git pull --ff-only origin "$BRANCH"
          cat > "$PACKAGE/STATUS.md" <<EOF
          # Status

          - package claim: \`n11-k6-q00r00-seventh-base-classification\`
          - evidence state: \`COMPUTATIONAL / DUAL_IMPLEMENTATION_REPRODUCED / CI_EXECUTION_COMPLETE / ARTIFACT_ARCHIVES_VERIFIED / EXECUTION_BOUND / REPOSITORY_GOVERNED / WORKING\`
          - classified source SHA: \`$CLASSIFIED_SOURCE_SHA\`
          - execution-workflow revision: \`$WORKFLOW_REVISION\`
          - workflow run: \`$RUN_ID\`
          - workflow job: \`$JOB_ID\`
          - artifact: \`$ARTIFACT_ID\` / \`$ARTIFACT_NAME\`
          - artifact archive SHA-256: \`$ARTIFACT_SHA256\`
          - execution evidence commit: \`$EXECUTION_COMMIT\`
          - governance binding commit: \`$GOVERNANCE_COMMIT\`
          - sixth-base input cases: \`36\`
          - compatible seventh candidates: \`10,297\`
          - canonical grandchildren: \`4,476\`
          - pointwise negative-control cases: \`8,483\`
          - canonical classification stream SHA-256: \`$CLASSIFICATION_STREAM_SHA256\`
          - scheduling tiers: \`15 PILOT / 816 SMALL / 2,573 MEDIUM / 1,072 LARGE\`
          - certified obstruction inputs: \`0\`
          - all sixth-base children: \`UNKNOWN\`
          - all seventh-base grandchildren: \`UNKNOWN\`
          - \`q00r00\`: \`UNKNOWN\`
          - \`q00\`: \`UNKNOWN\`
          - \`n11-k6-full\`: Gate 2 / \`OPEN\`

          The exact 41-file classification artifact was independently downloaded, hashed, unpacked, and checked against every internal checksum. The GitHub digest and independently recomputed ZIP SHA-256 agree exactly.

          No mathematical status changed. The next governed work unit is an isolated one-sided 12-colorability pilot covering exactly the 15 frozen PILOT grandchildren. A checked SAT result closes only that grandchild; a proof-checked UNSAT result enters the certified eighth-base refinement frontier; timeout, failure, or missing certification remains \`UNKNOWN\`.
          EOF
          sed -i 's/^          //' "$PACKAGE/STATUS.md"
          git add "$PACKAGE/STATUS.md"
          git diff --cached --check
          git commit -m 'Synchronize governed seventh-base classification status'
          git push origin HEAD:"$BRANCH"
