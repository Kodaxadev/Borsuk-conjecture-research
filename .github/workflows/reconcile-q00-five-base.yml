name: reconcile-q00-five-base

on:
  push:
    branches:
      - research/q00-fifth-base-reduction
    paths:
      - .github/workflows/reconcile-q00-five-base.yml

permissions:
  contents: write

concurrency:
  group: reconcile-q00-five-base
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: research/q00-fifth-base-reduction
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Require a complete checked crosswalk
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('borsuk_11_k6_q00_fifth_base_reduction/crosswalk-result.json')
          result = json.loads(path.read_text())
          expected = {
              'status': 'PASS',
              'candidate_count': 432,
              'class_count': 12,
              'complete_bijection': True,
              'coverage_assignments_equal_under_crosswalk': True,
              'all_transformed_child_vertex_sets_equal': True,
              'governed_commit': 'd358bbc0487f8ae211c5e62adf6aa3455e5f02ed',
              'governed_case_csv_sha256': 'd5b0825cd8645af2c595b3de3c851360e0b283d8ce61383482f76168e1ae9855',
              'governed_assignment_sha256': '6c94923a260290d59727bdcad68293b7f1962a7c5377885dd536fefa5962ffc7',
              'draft_case_csv_sha256': '01b3ee2e629788037f1ccd6906140302abddd1ae1c077aa8cf7e8f619adb807a',
          }
          actual = {key: result[key] for key in expected}
          if actual != expected:
              raise SystemExit(f'crosswalk prerequisite mismatch: {actual}')
          mapping = {row['governed_id']: row['draft_id'] for row in result['crosswalk']}
          required = {
              'q00r00': 'f11', 'q00r01': 'f09', 'q00r02': 'f05', 'q00r03': 'f07',
              'q00r04': 'f02', 'q00r05': 'f10', 'q00r06': 'f08', 'q00r07': 'f03',
              'q00r08': 'f06', 'q00r09': 'f01', 'q00r10': 'f04', 'q00r11': 'f00',
          }
          if mapping != required:
              raise SystemExit(f'unexpected crosswalk: {mapping}')
          if not all(row['transformed_child_vertex_sets_equal'] for row in result['crosswalk']):
              raise SystemExit('a transformed child set was not equal')
          print('PASS checked crosswalk prerequisite')
          PY

      - name: Synchronize the completed governed registration
        run: |
          set -euo pipefail
          git config user.name 'q00-reconciliation-bot'
          git config user.email 'q00-reconciliation-bot@users.noreply.github.com'
          git fetch --no-tags origin research-workspace-hardening
          base_sha="$(git rev-parse origin/research-workspace-hardening)"
          test "$base_sha" = d358bbc0487f8ae211c5e62adf6aa3455e5f02ed

          governed_paths=(
            .github/workflows/apply-q00-five-base-transitions.yml
            Makefile
            borsuk_11_k6_q00_five_base_reduction/PROOF.md
            borsuk_11_k6_q00_five_base_reduction/README.md
            borsuk_11_k6_q00_five_base_reduction/STATUS.md
            borsuk_11_k6_q00_five_base_reduction/case_status.json
            borsuk_11_k6_q00_five_base_reduction/generate_cases.py
            borsuk_11_k6_q00_five_base_reduction/verify_independent.js
            borsuk_11_k6_q00_five_base_reduction/verify_status.py
            cruthunas/evidence.json
            cruthunas/ledger.json
            cruthunas/sources.json
            cruthunas/transactions/n11-k6-q00-five-base-gate-2-to-3.ready.json
            cruthunas/transactions/n11-k6-q00-five-base-gate-3-to-4.ready.json
            cruthunas/transitions.json
            research/claims.json
            scripts/register_q00_five_base_reduction.py
          )
          for path in "${governed_paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "$base_sha:$path" > "$path"
          done

          git add "${governed_paths[@]}"
          git diff --cached --check
          git commit -m 'Synchronize governed q00 five-base registration'

      - name: Convert the draft package into a differential verifier
        run: |
          set -euo pipefail
          canonical=borsuk_11_k6_q00_five_base_reduction
          duplicate=borsuk_11_k6_q00_fifth_base_reduction
          differential="$canonical/differential"
          mkdir -p "$differential"

          git mv "$duplicate/generate_fifth_base_cases.py" "$differential/generate_stabilizer_orbits.py"
          git mv "$duplicate/verify_independent.js" "$differential/verify_stabilizer_orbits.js"
          git mv "$duplicate/crosswalk-result.json" "$differential/crosswalk-result.json"
          git rm -r "$duplicate"

          cat > "$differential/README.md" <<'EOF'
          # Differential q00 five-base verifier

          This directory preserves the independently written stabilizer-orbit implementation that originated on draft PR #8.

          It is not a separate mathematical package, claim, status ledger, or canonical classification. The governed authority remains:

          - claim: `n11-k6-q00-five-base-reduction`;
          - package: `borsuk_11_k6_q00_five_base_reduction/`;
          - canonical child IDs: `q00r00` through `q00r11`;
          - governed case-list SHA-256: `d5b0825cd8645af2c595b3de3c851360e0b283d8ce61383482f76168e1ae9855`;
          - governed assignment SHA-256: `6c94923a260290d59727bdcad68293b7f1962a7c5377885dd536fefa5962ffc7`.

          The historical `f00` through `f11` labels are retained only inside the differential verifier. `crosswalk-result.json` records their complete bijection with the governed IDs and verifies all 432 candidate assignments, explicit affine maps, per-child statistics, and exact transformed child vertex sets.

          ```bash
          node differential/verify_stabilizer_orbits.js
          python ../scripts/crosswalk_q00_five_base.py \
            --governed-root <worktree-at-d358bbc0487f8ae211c5e62adf6aa3455e5f02ed> \
            --draft-root .. \
            --output differential/crosswalk-result.json
          ```

          All 12 governed child trims remain `UNKNOWN`. This verifier does not resolve q00 or promote `n11-k6-full`.
          EOF
          sed -i 's/^          //' "$differential/README.md"

          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/crosswalk_q00_five_base.py')
          text = path.read_text()
          old = '''        / "borsuk_11_k6_q00_fifth_base_reduction"\n        / "generate_fifth_base_cases.py"'''
          new = '''        / "borsuk_11_k6_q00_five_base_reduction"\n        / "differential"\n        / "generate_stabilizer_orbits.py"'''
          if old not in text:
              raise SystemExit('draft generator path marker not found')
          text = text.replace(old, new)
          text = text.replace('"draft_claim_id": "n11-k6-q00-fifth-base-reduction",', '"historical_draft_claim_id": "n11-k6-q00-fifth-base-reduction",')
          path.write_text(text)

          workflow = Path('.github/workflows/verify-q00-five-base-crosswalk.yml')
          text = workflow.read_text()
          text = text.replace(
              'borsuk_11_k6_q00_fifth_base_reduction/**',
              'borsuk_11_k6_q00_five_base_reduction/differential/**',
          )
          text = text.replace(
              'destination=borsuk_11_k6_q00_fifth_base_reduction/crosswalk-result.json',
              'destination=borsuk_11_k6_q00_five_base_reduction/differential/crosswalk-result.json',
          )
          workflow.write_text(text)
          PY

          git rm \
            .github/workflows/apply-q00-fifth-base-transitions.yml \
            .github/workflows/certify-f11.yml \
            .github/workflows/register-f11-solver-lane.yml \
            .github/workflows/verify-q00-fifth-base.yml \
            .github/workflows/apply-q00-five-base-transitions.yml \
            scripts/register_q00_fifth_base_claim.py \
            scripts/register_q00_fifth_base_sat_lane.py \
            cruthunas/transactions/n11-k6-q00-fifth-base-gate-2-to-3.ready.json \
            cruthunas/transactions/n11-k6-q00-fifth-base-gate-3-to-4.ready.json

          git rm .github/workflows/reconcile-q00-five-base.yml

      - name: Recheck the canonical package and crosswalk
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/governed" d358bbc0487f8ae211c5e62adf6aa3455e5f02ed

          python scripts/crosswalk_q00_five_base.py \
            --governed-root "$RUNNER_TEMP/governed" \
            --draft-root "$GITHUB_WORKSPACE" \
            --output borsuk_11_k6_q00_five_base_reduction/differential/crosswalk-result.json

          cd borsuk_11_k6_q00_five_base_reduction
          python generate_cases.py
          node verify_independent.js
          python verify_status.py
          node differential/verify_stabilizer_orbits.js
          cd ..

          python scripts/validate_claims.py
          python scripts/cruthunas.py check --all
          python scripts/cruthunas.py adapters check
          python scripts/validate_cruthunas_transactions.py
          python scripts/validate_cruthunas_observations.py
          make verify

      - name: Commit reconciled verifier branch
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'Reconcile q00 five-base differential verifier'
          git push origin HEAD:research/q00-fifth-base-reduction
