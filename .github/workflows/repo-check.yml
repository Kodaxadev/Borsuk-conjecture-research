name: repo-check

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Cruthúnas and repository metadata
        run: |
          python scripts/cruthunas.py check --all
          python scripts/cruthunas.py adapters check
          python scripts/validate_cruthunas_transactions.py
          python scripts/repo_status.py
          test -f README.md
          test -f CONTRIBUTING.md
          test -f CITATION.cff
          test -f LICENSE
          test -f cruthunas/project.json
          test -f cruthunas/ledger.json
          test -f cruthunas/evidence.json
          test -f cruthunas/transitions.json
          test -f cruthunas/sources.json
          test -f cruthunas/schemas/evidence.schema.json
          test -f cruthunas/schemas/transition.schema.json
          test -f cruthunas/schemas/transaction.schema.json
          test -f cruthunas/transactions/n11-k6-gate-2-to-3.blocked.json
