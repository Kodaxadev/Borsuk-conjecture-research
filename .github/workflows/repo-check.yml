name: repo-check

on:
  push:
  pull_request:

jobs:
  verify-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify repository metadata
        run: |
          python scripts/repo_status.py
          test -f README.md
          test -f CONTRIBUTING.md
          test -f CITATION.cff
          test -f LICENSE
