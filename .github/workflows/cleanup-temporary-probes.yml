name: cleanup-temporary-probes

on:
  push:
    branches: [research-workspace-hardening]
    paths:
      - '.github/workflows/cleanup-temporary-probes.yml'

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research-workspace-hardening
          fetch-depth: 0

      - name: Wait for active one-off proof runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_run='${{ github.run_id }}'
          for attempt in $(seq 1 60); do
            active="$({ gh run list \
              --repo '${{ github.repository }}' \
              --branch research-workspace-hardening \
              --limit 100 \
              --json databaseId,name,status \
              --jq '.[] | select(.databaseId != ('"$current_run"' | tonumber)) | select((.name | test("oneoff-q00|publish-q00")) and (.status == "queued" or .status == "in_progress" or .status == "waiting")) | .databaseId'; } || true)"
            if [ -z "$active" ]; then
              exit 0
            fi
            echo "Waiting for active temporary runs: $active"
            sleep 15
          done

          active="$({ gh run list \
            --repo '${{ github.repository }}' \
            --branch research-workspace-hardening \
            --limit 100 \
            --json databaseId,name,status \
            --jq '.[] | select(.databaseId != ('"$current_run"' | tonumber)) | select((.name | test("oneoff-q00|publish-q00")) and (.status == "queued" or .status == "in_progress" or .status == "waiting")) | .databaseId'; } || true)"
          for run_id in $active; do
            echo "Canceling stale temporary run $run_id"
            gh run cancel "$run_id" --repo '${{ github.repository }}' || true
          done

      - name: Remove temporary workflow files and self-delete
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin research-workspace-hardening
          git rebase origin/research-workspace-hardening
          rm -f \
            .github/workflows/oneoff-q00-compact.yml \
            .github/workflows/oneoff-q00-proof-safe.yml \
            .github/workflows/publish-q00-compact-probe-summary.yml \
            .github/workflows/cleanup-temporary-probes.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to clean.'
            exit 0
          fi
          git commit -m 'Remove temporary q00 solver workflows'
          git push origin HEAD:research-workspace-hardening
