name: archive-q00r00-sixth-base-child-trims

on:
  push:
    branches:
      - research/q00r00-sixth-base-child-trims
    paths:
      - '.github/workflows/archive-q00r00-sixth-base-child-trims.yml'

permissions:
  actions: read
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/q00r00-sixth-base-child-trims
          fetch-depth: 0

      - name: Download and verify exact artifact archive
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: '8870872535'
          EXPECTED_SHA256: a1862053e19a4341b941e62181c180805fb59a7969241d473705635dd04d0505
        run: |
          set -euo pipefail
          package='borsuk_11_k6_q00r00_sixth_base_child_trims'
          archive_dir="$package/evidence/artifacts"
          archive_path="$archive_dir/q00r00-sixth-base-child-trims-run-30851783510.zip"
          mkdir -p "$archive_dir"

          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$archive_path"

          actual_sha256="$(sha256sum "$archive_path" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_SHA256"
          unzip -t "$archive_path"
          printf '%s  %s\n' "$actual_sha256" "$(basename "$archive_path")" > "$archive_path.sha256"

      - name: Write governed execution binding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          package = Path('borsuk_11_k6_q00r00_sixth_base_child_trims')
          archive_rel = 'evidence/artifacts/q00r00-sixth-base-child-trims-run-30851783510.zip'
          digest = 'a1862053e19a4341b941e62181c180805fb59a7969241d473705635dd04d0505'
          binding = {
              'schema': 'borsuk-q00r00-sixth-base-child-trims-execution-binding-v1',
              'claim_id': 'n11-k6-q00r00-sixth-base-child-trims',
              'status': 'PASS',
              'evidence_state': [
                  'COMPUTATIONAL',
                  'DUAL_IMPLEMENTATION_REPRODUCED',
                  'CI_INDEPENDENTLY_REPRODUCED',
                  'EXECUTION_BOUND',
                  'WORKING',
              ],
              'source': {
                  'branch': 'research/q00r00-sixth-base-child-trims',
                  'commit': 'aad27339d6e689afdb50dbb8c280a76230b915fc',
              },
              'workflow': {
                  'name': 'verify-q00r00-sixth-base-child-trims',
                  'event': 'push',
                  'run_id': 30851783510,
                  'conclusion': 'success',
              },
              'job': {
                  'name': 'generate-and-verify',
                  'id': 91813267533,
                  'conclusion': 'success',
                  'steps': {
                      'Generate and independently verify all 36 trims': 'success',
                      'Upload complete child-trim certificates': 'success',
                  },
              },
              'artifact': {
                  'name': 'q00r00-sixth-base-child-trims',
                  'id': 8870872535,
                  'size_in_bytes_compressed': 2025068,
                  'created_at': '2026-08-03T20:47:29Z',
                  'expires_at': '2026-11-01T20:47:07Z',
                  'expired_when_archived': False,
                  'github_digest': f'sha256:{digest}',
                  'downloaded_archive_sha256': digest,
                  'downloaded_archive_sha256_verified': True,
                  'repository_archive_path': archive_rel,
              },
              'certificates': {
                  'aggregate_manifest_sha256': '559f83e4eb245902b9ec1808812248694c7931a535213c45b50d7a89a461e5fa',
                  'canonical_checksum_manifest_sha256': '45e96e2b460d6f968ed664b06ec59adc6091040273acf9cfbc022d3a1586654c',
                  'generated_file_count_before_comparison': 183,
                  'archive_file_count': 184,
                  'child_count': 36,
                  'total_vertices_across_children': 10513,
                  'total_distance6_edges_across_children': 611145,
                  'total_incompatible_pairs_across_children': 178886,
              },
              'parent_classification': {
                  'governed_head': 'bb2fb6879805d1d7f024c67554dae4784ebab219',
                  'source_commit': '1cee54611bf414f7961cbdd43f5fc2b867b3230d',
                  'workflow_run_id': 30842512224,
                  'artifact_id': 8867349456,
                  'artifact_archive_sha256': '0f45e952cda60a47f01fb0a415de07438cc9bc32f3d4811c8d17ce1cb2982a7d',
              },
              'mathematical_status': {
                  'sixth_base_children': 'UNKNOWN',
                  'q00r00': 'UNKNOWN',
                  'q00': 'UNKNOWN',
                  'n11-k6-full': 'Gate 2 / OPEN',
              },
          }
          (package / 'EXECUTION_BINDING.json').write_text(
              json.dumps(binding, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          status_path = package / 'STATUS.md'
          status = status_path.read_text(encoding='utf-8')
          status = status.replace(
              '`COMPUTATIONAL / DUAL_IMPLEMENTATION_REPRODUCED / CI_EXECUTION_PENDING / WORKING`',
              '`COMPUTATIONAL / DUAL_IMPLEMENTATION_REPRODUCED / CI_INDEPENDENTLY_REPRODUCED / EXECUTION_BOUND / WORKING`',
          )
          status = status.replace(
              'Local dual-implementation verification passes. The claim is not execution-bound until the dedicated GitHub Actions run and uploaded artifact are independently recorded.',
              'The dual implementations and dedicated GitHub Actions execution pass. Run `30851783510`, job `91813267533`, artifact `8870872535`, and the independently verified archive digest are bound in `EXECUTION_BINDING.json`. The exact artifact ZIP is preserved under `evidence/artifacts/`.',
          )
          if '- execution-bound workflow run:' not in status:
              marker = '- aggregate manifest SHA-256:'
              lines = status.splitlines()
              insert_at = next(i for i, line in enumerate(lines) if line.startswith(marker))
              lines[insert_at:insert_at] = [
                  '- execution-bound workflow run: `30851783510`',
                  '- execution-bound workflow job: `91813267533`',
                  '- execution-bound artifact: `8870872535`',
                  '- archived artifact SHA-256: `a1862053e19a4341b941e62181c180805fb59a7969241d473705635dd04d0505`',
              ]
              status = '\n'.join(lines) + '\n'
          status_path.write_text(status, encoding='utf-8')

          readme_path = package / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          heading = '## Execution binding and repository archive'
          if heading not in readme:
              readme = readme.rstrip() + f'''\n\n{heading}\n\nThe governed child-trim package is bound to successful workflow run `30851783510`, job `91813267533`, source commit `aad27339d6e689afdb50dbb8c280a76230b915fc`, and artifact `q00r00-sixth-base-child-trims` (`8870872535`).\n\nThe exact downloaded artifact ZIP is preserved at `{archive_rel}` with SHA-256 `{digest}`, matching GitHub's artifact digest. Complete machine-readable provenance is recorded in `EXECUTION_BINDING.json`.\n\nThis closes the trim-generation work unit without changing any child or parent mathematical status.\n'''
              readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Commit durable archive and binding
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            borsuk_11_k6_q00r00_sixth_base_child_trims/evidence/artifacts/ \
            borsuk_11_k6_q00r00_sixth_base_child_trims/EXECUTION_BINDING.json \
            borsuk_11_k6_q00r00_sixth_base_child_trims/STATUS.md \
            borsuk_11_k6_q00r00_sixth_base_child_trims/README.md
          git diff --cached --check
          git commit -m 'Archive q00r00 child-trim certificates'
          git push origin HEAD:research/q00r00-sixth-base-child-trims
