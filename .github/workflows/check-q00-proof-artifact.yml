name: check-q00-proof-artifact

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/check-q00-proof-artifact.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: check-q00-proof-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-preserved-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_RUN_ID: 30822622138
      SOURCE_ARTIFACT_ID: 8859778824
      SOURCE_ARTIFACT_DIGEST: e75f4a6571a22bef7f686ec6f91037f17598fecf19872d1c085113f706be2351
      EXPECTED_CNF_SHA256: 36da8f78ae376b370f119d1fa16a58f6504607d949ac8315648fdbda52450299
      EXPECTED_MAP_SHA256: 5f94c619b6a5996c54f269a88de5bfaff042e4c855ea8543869b84009c7dae45
      DRAT_TRIM_REVISION: 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
      CRUTHUNAS_CLAIM_ID: n11-k6-four-base-reduction

    steps:
      - name: Checkout governed research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Cruthúnas governance
        run: |
          set -euo pipefail
          python scripts/cruthunas.py check --all
          python scripts/cruthunas.py adapters check
          python scripts/validate_cruthunas_transactions.py
          python scripts/validate_cruthunas_observations.py

      - name: Download preserved q00 certificate attempt
        uses: actions/download-artifact@v4
        with:
          name: q00-certificate-attempt
          path: /tmp/q00-source
          repository: Kodaxadev/Borsuk-conjecture-research
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate preserved instance and proof presence
        run: |
          set -euo pipefail
          find /tmp/q00-source -maxdepth 2 -type f -printf '%P\n' | sort | tee /tmp/q00-files.txt
          test -s /tmp/q00-source/q00_12color.cnf
          test -s /tmp/q00-source/q00_variable_map.json
          test -s /tmp/q00-source/q00.drat
          echo "$EXPECTED_CNF_SHA256  /tmp/q00-source/q00_12color.cnf" | sha256sum --check --strict
          echo "$EXPECTED_MAP_SHA256  /tmp/q00-source/q00_variable_map.json" | sha256sum --check --strict
          grep -Eq '^s UNSATISFIABLE' /tmp/q00-source/solver.out
          test "$(tail -n 1 /tmp/q00-source/q00.drat | tr -d '[:space:]')" = 0

      - name: Build pinned independent DRAT checker
        run: |
          set -euo pipefail
          rm -rf /tmp/drat-trim
          git clone --filter=blob:none https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          cd /tmp/drat-trim
          git checkout --detach "$DRAT_TRIM_REVISION"
          make -j2
          test -x drat-trim
          mkdir -p "$GITHUB_WORKSPACE/q00-check-result"
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/q00-check-result/checker-revision.txt"
          sha256sum drat-trim | tee "$GITHUB_WORKSPACE/q00-check-result/checker-binary.sha256"

      - name: Check exact proof
        run: |
          set -euo pipefail
          cnf=/tmp/q00-source/q00_12color.cnf
          proof=/tmp/q00-source/q00.drat
          result="$GITHUB_WORKSPACE/q00-check-result"
          /usr/bin/time -v /tmp/drat-trim/drat-trim "$cnf" "$proof" -v \
            >"$result/checker.out" 2>"$result/checker.err"
          grep -Eq 's VERIFIED|VERIFIED' "$result/checker.out" "$result/checker.err"

      - name: Reject proof missing final contradiction
        run: |
          set -euo pipefail
          cnf=/tmp/q00-source/q00_12color.cnf
          proof=/tmp/q00-source/q00.drat
          bad=/tmp/q00-missing-final-empty-clause.drat
          result="$GITHUB_WORKSPACE/q00-check-result"
          head -n -1 "$proof" >"$bad"
          test -s "$bad"
          test "$(stat -c %s "$bad")" -lt "$(stat -c %s "$proof")"
          set +e
          /usr/bin/time -v /tmp/drat-trim/drat-trim "$cnf" "$bad" -v \
            >"$result/negative-control.out" 2>"$result/negative-control.err"
          negative_status=$?
          set -e
          echo "$negative_status" >"$result/negative-control.exit-status"
          if grep -Eq 's VERIFIED|VERIFIED' "$result/negative-control.out" "$result/negative-control.err"; then
            echo 'proof with final empty-clause line removed was unexpectedly accepted' >&2
            exit 1
          fi
          rm -f "$bad"

      - name: Write certificate metadata
        run: |
          set -euo pipefail
          result="$GITHUB_WORKSPACE/q00-check-result"
          python - "$result/certificate-result.json" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path

          source = Path('/tmp/q00-source')
          result = Path(sys.argv[1]).parent
          proof = source / 'q00.drat'
          payload = {
              'schema': 'borsuk-proof-checked-unsat-result-v1',
              'case_id': 'q00',
              'claim_id': os.environ['CRUTHUNAS_CLAIM_ID'],
              'source_workflow_run_id': int(os.environ['SOURCE_RUN_ID']),
              'source_artifact_id': int(os.environ['SOURCE_ARTIFACT_ID']),
              'source_artifact_digest': 'sha256:' + os.environ['SOURCE_ARTIFACT_DIGEST'],
              'cnf_sha256': os.environ['EXPECTED_CNF_SHA256'],
              'variable_map_sha256': os.environ['EXPECTED_MAP_SHA256'],
              'proof_sha256': hashlib.sha256(proof.read_bytes()).hexdigest(),
              'proof_bytes': proof.stat().st_size,
              'checker': 'drat-trim',
              'checker_revision': os.environ['DRAT_TRIM_REVISION'],
              'checker_binary_sha256': (result / 'checker-binary.sha256').read_text().split()[0],
              'checker_output_sha256': hashlib.sha256((result / 'checker.out').read_bytes()).hexdigest(),
              'checker_stderr_sha256': hashlib.sha256((result / 'checker.err').read_bytes()).hexdigest(),
              'negative_control': 'final empty-clause proof line removed and rejected',
              'negative_control_output_sha256': hashlib.sha256((result / 'negative-control.out').read_bytes()).hexdigest(),
              'negative_control_stderr_sha256': hashlib.sha256((result / 'negative-control.err').read_bytes()).hexdigest(),
              'certificate_state': 'PROOF_CHECKED_UNSAT',
              'proof_check_tier': 'manual-heavy',
              'repository_status_changed': False,
              'cruthunas_evidence_registered': False,
              'case_status_changed': False,
              'interpretation': 'The exact q00 compact trim CNF is proof-checked UNSAT. This does not settle the legal diameter-6 case because q00 is a universal trim and must be refined by a fifth compatible base or exact incompatibility branching.',
              'next_required_step': 'Store and register typed certificate evidence, then construct exhaustive q00 refinement children before changing case_status.json.',
          }
          Path(sys.argv[1]).write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          sha256sum "$result"/* >"$result/result-sha256.txt"

      - name: Compress preserved proof
        run: |
          set -euo pipefail
          gzip -9 /tmp/q00-source/q00.drat
          sha256sum /tmp/q00-source/q00.drat.gz | tee "$GITHUB_WORKSPACE/q00-check-result/compressed-proof.sha256"
          stat -c '%s' /tmp/q00-source/q00.drat.gz | tee "$GITHUB_WORKSPACE/q00-check-result/compressed-proof.bytes"

      - name: Upload compact checker metadata
        uses: actions/upload-artifact@v4
        with:
          name: q00-proof-checked-metadata
          path: q00-check-result/
          if-no-files-found: error
          retention-days: 90

      - name: Upload compressed proof certificate
        uses: actions/upload-artifact@v4
        with:
          name: q00-proof-checked-certificate
          path: |
            /tmp/q00-source/q00.drat.gz
            /tmp/q00-source/q00_12color.cnf
            /tmp/q00-source/q00_variable_map.json
            q00-check-result/certificate-result.json
            q00-check-result/checker.out
            q00-check-result/checker.err
            q00-check-result/checker-revision.txt
            q00-check-result/checker-binary.sha256
            q00-check-result/negative-control.out
            q00-check-result/negative-control.err
            q00-check-result/negative-control.exit-status
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Report bounded research result
        run: |
          echo 'The exact q00 compact trim CNF has an independently checked UNSAT proof and a valid negative control.'
          echo 'No Cruthúnas evidence, case status, theorem gate, or ledger state was changed by this workflow.'
