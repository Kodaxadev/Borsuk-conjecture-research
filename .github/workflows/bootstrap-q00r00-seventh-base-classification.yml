name: bootstrap-q00r00-seventh-base-classification

on:
  push:
    branches:
      - research/q00r00-seventh-base-classification
    paths:
      - '.github/workflows/bootstrap-q00r00-seventh-base-classification.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/q00r00-seventh-base-classification
          fetch-depth: 0
      - name: Verify bootstrap boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 3b502090b0a0c246645b408c561c6a258ca46dbe
          test -z "$(git status --porcelain)"
      - name: Install frozen package atomically
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path
          payload = ''
          Path('/tmp/seventh-package.tar.gz').write_bytes(base64.b64decode(payload))
          PY
          echo '6230cd0e77cfed35209a2817b4cca6fbc2e2a3bd32902a62d683d5d440dc2338  /tmp/seventh-package.tar.gz' | sha256sum --check --strict
          tar -tzf /tmp/seventh-package.tar.gz | grep -Ev '(^/|\.\./)' >/tmp/payload-paths.txt
          test "$(wc -l </tmp/payload-paths.txt)" -eq 10
          tar -xzf /tmp/seventh-package.tar.gz -C .
          python -m py_compile borsuk_11_k6_q00r00_seventh_base_classification/classify.py borsuk_11_k6_q00r00_seventh_base_classification/verify_package.py
          node --check borsuk_11_k6_q00r00_seventh_base_classification/verify_independent.js
      - name: Commit tested package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/verify-q00r00-seventh-base-classification.yml borsuk_11_k6_q00r00_seventh_base_classification
          git diff --cached --check
          git commit -m 'Add conservative q00r00 seventh-base classification'
          git push origin HEAD:research/q00r00-seventh-base-classification
