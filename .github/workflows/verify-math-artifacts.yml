name: verify-math-artifacts

on:
  push:
  pull_request:

jobs:
  verify-lightweight-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate registry and run independent verifiers
        run: make verify

      - name: Print research status
        if: always()
        run: make status
