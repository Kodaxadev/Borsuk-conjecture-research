name: verify-math-artifacts

on:
  push:
  pull_request:

jobs:
  check-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm required package directories
        run: |
          test -d borsuk_11_k4_candidate
          test -d borsuk_11_k6_attack_surface
          test -d borsuk_11_k6_trim_unsat_certificate
          test -d borsuk_11_k8_candidate
          test -d borsuk_n10_k4_reproduction
