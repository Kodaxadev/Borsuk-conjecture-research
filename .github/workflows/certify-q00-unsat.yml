name: certify-q00-unsat

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/certify-q00-unsat.yml

concurrency:
  group: certify-q00-unsat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  produce-and-check-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CASE_ID: q00
      EXPECTED_CNF_SHA256: 36da8f78ae376b370f119d1fa16a58f6504607d949ac8315648fdbda52450299
      EXPECTED_MAP_SHA256: 5f94c619b6a5996c54f269a88de5bfaff042e4c855ea8543869b84009c7dae45
      KISSAT_ARCHIVE_MD5: 89801fadc6d7a2ee1519a9cccf0c9029
      DRAT_TRIM_REVISION: 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
      SOLVER_LIMIT_SECONDS: 900
      CRUTHUNAS_CLAIM_ID: n11-k6-four-base-reduction

    steps:
      - name: Checkout governed research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Cruthúnas governance
        run: |
          set -euo pipefail
          python scripts/cruthunas.py check --all
          python scripts/cruthunas.py adapters check
          python scripts/validate_cruthunas_transactions.py
          python scripts/validate_cruthunas_observations.py

      - name: Regenerate and freeze exact q00 instance
        working-directory: borsuk_11_k6_four_base_reduction
        run: |
          set -euo pipefail
          rm -rf work/q00-certificate
          python build_instance.py q00 --output-dir work/q00-certificate
          echo "$EXPECTED_CNF_SHA256  work/q00-certificate/q00_12color.cnf" | sha256sum --check --strict
          echo "$EXPECTED_MAP_SHA256  work/q00-certificate/q00_variable_map.json" | sha256sum --check --strict

      - name: Build pinned Kissat 4.0.0
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://zenodo.org/records/13081405/files/arminbiere/kissat-rel-4.0.0.zip?download=1' \
            --output /tmp/kissat-rel-4.0.0.zip
          echo "$KISSAT_ARCHIVE_MD5  /tmp/kissat-rel-4.0.0.zip" | md5sum --check --strict
          rm -rf /tmp/kissat-source
          mkdir /tmp/kissat-source
          unzip -q /tmp/kissat-rel-4.0.0.zip -d /tmp/kissat-source
          configure_path="$(find /tmp/kissat-source -type f -name configure | head -n 1)"
          test -n "$configure_path"
          source_dir="$(dirname "$configure_path")"
          cd "$source_dir"
          ./configure
          make -j2
          test -x build/kissat
          cp build/kissat /tmp/kissat-4.0.0
          /tmp/kissat-4.0.0 --version | tee "$GITHUB_WORKSPACE/borsuk_11_k6_four_base_reduction/work/q00-certificate/solver-version.txt"
          sha256sum /tmp/kissat-4.0.0 | tee "$GITHUB_WORKSPACE/borsuk_11_k6_four_base_reduction/work/q00-certificate/solver-binary.sha256"

      - name: Build pinned independent DRAT checker
        run: |
          set -euo pipefail
          rm -rf /tmp/drat-trim
          git clone --filter=blob:none https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          cd /tmp/drat-trim
          git checkout --detach "$DRAT_TRIM_REVISION"
          make -j2
          test -x drat-trim
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/borsuk_11_k6_four_base_reduction/work/q00-certificate/checker-revision.txt"
          sha256sum drat-trim | tee "$GITHUB_WORKSPACE/borsuk_11_k6_four_base_reduction/work/q00-certificate/checker-binary.sha256"

      - name: Produce q00 DRAT proof
        id: solve
        working-directory: borsuk_11_k6_four_base_reduction
        shell: bash
        run: |
          set -u
          work=work/q00-certificate
          cnf="$work/q00_12color.cnf"
          proof="$work/q00.drat"
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          /usr/bin/time -v timeout --signal=TERM --kill-after=30s "$SOLVER_LIMIT_SECONDS" \
            /tmp/kissat-4.0.0 "$cnf" "$proof" \
            >"$work/solver.out" 2>"$work/solver.err"
          solver_status=$?
          set -e
          finished="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [ "$solver_status" -ne 20 ] || [ ! -s "$proof" ]; then
            rm -f "$proof"
            result=UNKNOWN
          else
            result=UNSAT_PROOF_UNCHECKED
          fi

          export SOLVER_STATUS="$solver_status" STARTED_UTC="$started" FINISHED_UTC="$finished" RESULT_STATE="$result"
          python - "$work/run-result.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              'schema': 'borsuk-q00-certificate-attempt-v1',
              'case_id': 'q00',
              'claim_id': os.environ['CRUTHUNAS_CLAIM_ID'],
              'cnf_sha256': os.environ['EXPECTED_CNF_SHA256'],
              'solver': 'Kissat 4.0.0',
              'solver_limit_seconds': int(os.environ['SOLVER_LIMIT_SECONDS']),
              'solver_exit_status': int(os.environ['SOLVER_STATUS']),
              'started_utc': os.environ['STARTED_UTC'],
              'finished_utc': os.environ['FINISHED_UTC'],
              'state': os.environ['RESULT_STATE'],
              'repository_status_changed': False,
              'cruthunas_evidence_registered': False,
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

          echo "solver_status=$solver_status" >> "$GITHUB_OUTPUT"
          echo "result_state=$result" >> "$GITHUB_OUTPUT"

      - name: Independently check proof and negative control
        id: check
        if: steps.solve.outputs.result_state == 'UNSAT_PROOF_UNCHECKED'
        working-directory: borsuk_11_k6_four_base_reduction
        shell: bash
        run: |
          set -euo pipefail
          work=work/q00-certificate
          cnf="$work/q00_12color.cnf"
          proof="$work/q00.drat"

          /usr/bin/time -v /tmp/drat-trim/drat-trim "$cnf" "$proof" -v \
            >"$work/checker.out" 2>"$work/checker.err"
          grep -E 's VERIFIED|VERIFIED' "$work/checker.out" "$work/checker.err"

          proof_size="$(stat -c %s "$proof")"
          test "$proof_size" -gt 1
          head -c "$((proof_size - 1))" "$proof" >"$work/q00-truncated-negative-control.drat"
          set +e
          /tmp/drat-trim/drat-trim "$cnf" "$work/q00-truncated-negative-control.drat" \
            >"$work/negative-control.out" 2>"$work/negative-control.err"
          negative_status=$?
          set -e
          rm -f "$work/q00-truncated-negative-control.drat"
          if grep -Eq 's VERIFIED|VERIFIED' "$work/negative-control.out" "$work/negative-control.err"; then
            echo 'truncated proof was unexpectedly accepted' >&2
            exit 1
          fi
          echo "$negative_status" >"$work/negative-control.exit-status"

          python - "$work/certificate-result.json" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          root = Path(sys.argv[1]).parent
          proof = root / 'q00.drat'
          checker_out = root / 'checker.out'
          checker_err = root / 'checker.err'
          payload = {
              'schema': 'borsuk-proof-checked-unsat-result-v1',
              'case_id': 'q00',
              'claim_id': os.environ['CRUTHUNAS_CLAIM_ID'],
              'cnf_sha256': os.environ['EXPECTED_CNF_SHA256'],
              'proof_sha256': hashlib.sha256(proof.read_bytes()).hexdigest(),
              'proof_bytes': proof.stat().st_size,
              'checker': 'drat-trim',
              'checker_revision': os.environ['DRAT_TRIM_REVISION'],
              'checker_output_sha256': hashlib.sha256(checker_out.read_bytes()).hexdigest(),
              'checker_stderr_sha256': hashlib.sha256(checker_err.read_bytes()).hexdigest(),
              'negative_control': 'truncated proof rejected',
              'certificate_state': 'PROOF_CHECKED_UNSAT',
              'repository_status_changed': False,
              'cruthunas_evidence_registered': False,
              'next_required_step': 'Register typed evidence and refine q00 by a compatible fifth base or exact incompatibility branch before setting UNSAT_REFINED.',
          }
          Path(sys.argv[1]).write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          gzip -9 "$proof"
          echo 'proof_checked=true' >> "$GITHUB_OUTPUT"

      - name: Write artifact index
        if: always()
        working-directory: borsuk_11_k6_four_base_reduction
        run: |
          set -euo pipefail
          work=work/q00-certificate
          python - "$work/artifact-index.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root = Path(sys.argv[1]).parent
          files = {}
          for path in sorted(root.iterdir()):
              if path.is_file():
                  files[path.name] = {
                      'bytes': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
          Path(sys.argv[1]).write_text(json.dumps({
              'schema': 'borsuk-certificate-artifact-index-v1',
              'case_id': 'q00',
              'files': files,
              'repository_status_changed': False,
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Upload certificate-attempt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q00-certificate-attempt
          path: borsuk_11_k6_four_base_reduction/work/q00-certificate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Report research state
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.check.outputs.proof_checked }}" = true ]; then
            echo 'q00 produced an independently checked UNSAT proof. Repository and Cruthúnas status remain unchanged pending evidence registration and exact refinement.'
          else
            echo 'q00 did not produce an independently checked certificate in this run. It remains UNKNOWN.'
          fi
