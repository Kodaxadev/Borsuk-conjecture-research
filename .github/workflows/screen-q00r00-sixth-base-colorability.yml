name: screen-q00r00-sixth-base-colorability

on:
  workflow_dispatch:
  push:
    branches:
      - research/q00r00-sixth-base-colorability-screen
    paths:
      - 'borsuk_11_k6_q00r00_sixth_base_colorability_screen/**'
      - '.github/workflows/screen-q00r00-sixth-base-colorability.yml'
      - 'borsuk_11_k6_q00r00_sixth_base_child_trims/evidence/artifacts/q00r00-sixth-base-child-trims-run-30851783510.zip'

permissions:
  contents: read

concurrency:
  group: q00r00-sixth-base-colorability-${{ github.sha }}
  cancel-in-progress: false

env:
  PACKAGE: borsuk_11_k6_q00r00_sixth_base_colorability_screen
  SOURCE_ARCHIVE: borsuk_11_k6_q00r00_sixth_base_child_trims/evidence/artifacts/q00r00-sixth-base-child-trims-run-30851783510.zip
  SOURCE_ARCHIVE_SHA256: a1862053e19a4341b941e62181c180805fb59a7969241d473705635dd04d0505
  KISSAT_ARCHIVE_MD5: 89801fadc6d7a2ee1519a9cccf0c9029
  DRAT_TRIM_REVISION: 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
  SOLVER_LIMIT_SECONDS: '1800'
  CHECKER_LIMIT_SECONDS: '1800'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify governed child-trim archive
        run: |
          set -euo pipefail
          echo "$SOURCE_ARCHIVE_SHA256  $SOURCE_ARCHIVE" | sha256sum --check --strict
          rm -rf "$PACKAGE/work"
          mkdir -p "$PACKAGE/work/input/trim-input" "$PACKAGE/work/input/toolchain"
          cp "$SOURCE_ARCHIVE" "$PACKAGE/work/input/source.zip"
          unzip -q "$SOURCE_ARCHIVE" -d "$PACKAGE/work/input/trim-input"
          unzip -t "$SOURCE_ARCHIVE"

      - name: Generate all canonical screen instances
        run: |
          set -euo pipefail
          python "$PACKAGE/build_instances.py" \
            --trim-root "$PACKAGE/work/input/trim-input" \
            --output "$PACKAGE/work/input/instances" \
            | tee "$PACKAGE/work/input/build-instances.out"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          package = Path(os.environ['PACKAGE'])
          expected = json.loads((package / 'EXPECTED_OUTPUT.json').read_text())
          instances = package / 'work/input/instances'
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          assert digest(instances / 'instances.json') == expected['instances_sha256']
          assert digest(instances / 'SHA256SUMS') == expected['sha256sums_sha256']
          aggregate = json.loads((instances / 'instances.json').read_text())
          assert aggregate['case_count'] == expected['case_count'] == 36
          assert aggregate['totals'] == expected['totals']
          PY

      - name: Independently reproduce and verify every CNF
        run: |
          set -euo pipefail
          node "$PACKAGE/verify_instances.js" \
            --trim-root "$PACKAGE/work/input/trim-input" \
            --instances "$PACKAGE/work/input/instances" \
            | tee "$PACKAGE/work/input/independent-instance-check.json"
          python "$PACKAGE/verify_coloring.py" --self-test \
            | tee "$PACKAGE/work/input/coloring-verifier-self-test.txt"

      - name: Build pinned Kissat 4.0.0
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://zenodo.org/records/13081405/files/arminbiere/kissat-rel-4.0.0.zip?download=1' \
            --output /tmp/kissat.zip
          echo "$KISSAT_ARCHIVE_MD5  /tmp/kissat.zip" | md5sum --check --strict
          rm -rf /tmp/kissat-source
          mkdir /tmp/kissat-source
          unzip -q /tmp/kissat.zip -d /tmp/kissat-source
          configure_path="$(find /tmp/kissat-source -type f -name configure | head -n 1)"
          test -n "$configure_path"
          source_dir="$(dirname "$configure_path")"
          cd "$source_dir"
          ./configure
          make -j2
          test -x build/kissat
          cp build/kissat "$GITHUB_WORKSPACE/$PACKAGE/work/input/toolchain/kissat"
          build/kissat --version \
            | tee "$GITHUB_WORKSPACE/$PACKAGE/work/input/toolchain/kissat-version.txt"
          sha256sum build/kissat \
            | tee "$GITHUB_WORKSPACE/$PACKAGE/work/input/toolchain/kissat-binary.sha256"

      - name: Build pinned independent DRAT checker
        run: |
          set -euo pipefail
          rm -rf /tmp/drat-trim
          git clone --filter=blob:none https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          cd /tmp/drat-trim
          git checkout --detach "$DRAT_TRIM_REVISION"
          make -j2
          test -x drat-trim
          cp drat-trim "$GITHUB_WORKSPACE/$PACKAGE/work/input/toolchain/drat-trim"
          git rev-parse HEAD \
            | tee "$GITHUB_WORKSPACE/$PACKAGE/work/input/toolchain/drat-trim-revision.txt"
          sha256sum drat-trim \
            | tee "$GITHUB_WORKSPACE/$PACKAGE/work/input/toolchain/drat-trim-binary.sha256"

      - name: Upload frozen instances and pinned toolchain
        uses: actions/upload-artifact@v4
        with:
          name: q00r00-sixth-base-screen-inputs-${{ github.sha }}
          path: ${{ env.PACKAGE }}/work/input/
          if-no-files-found: error
          compression-level: 6
          retention-days: 90

  screen:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case_id:
          - q00r00-s000
          - q00r00-s001
          - q00r00-s002
          - q00r00-s003
          - q00r00-s004
          - q00r00-s005
          - q00r00-s006
          - q00r00-s007
          - q00r00-s008
          - q00r00-s009
          - q00r00-s010
          - q00r00-s011
          - q00r00-s012
          - q00r00-s013
          - q00r00-s014
          - q00r00-s015
          - q00r00-s016
          - q00r00-s017
          - q00r00-s018
          - q00r00-s019
          - q00r00-s020
          - q00r00-s021
          - q00r00-s022
          - q00r00-s023
          - q00r00-s024
          - q00r00-s025
          - q00r00-s026
          - q00r00-s027
          - q00r00-s028
          - q00r00-s029
          - q00r00-s030
          - q00r00-s031
          - q00r00-s032
          - q00r00-s033
          - q00r00-s034
          - q00r00-s035
    env:
      CASE_ID: ${{ matrix.case_id }}
    steps:
      - name: Checkout verifier sources only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download frozen instances and toolchain
        uses: actions/download-artifact@v4
        with:
          name: q00r00-sixth-base-screen-inputs-${{ github.sha }}
          path: ${{ env.PACKAGE }}/work/input

      - name: Restore exact child-trim source tree
        run: |
          set -euo pipefail
          echo "$SOURCE_ARCHIVE_SHA256  $PACKAGE/work/input/source.zip" | sha256sum --check --strict
          rm -rf "$PACKAGE/work/trim-input"
          mkdir -p "$PACKAGE/work/trim-input"
          unzip -q "$PACKAGE/work/input/source.zip" -d "$PACKAGE/work/trim-input"
          chmod +x "$PACKAGE/work/input/toolchain/kissat" "$PACKAGE/work/input/toolchain/drat-trim"

      - name: Solve exact child CNF
        id: solve
        shell: bash
        run: |
          set -u
          result_dir="$PACKAGE/work/results/$CASE_ID"
          instance_dir="$PACKAGE/work/input/instances/cases/$CASE_ID"
          cnf="$instance_dir/${CASE_ID}_12color.cnf"
          proof="$result_dir/${CASE_ID}.drat"
          mkdir -p "$result_dir"
          cp "$cnf" "$result_dir/"
          cp "$instance_dir/${CASE_ID}_variable_map.json" "$result_dir/"
          cp "$instance_dir/${CASE_ID}_metadata.json" "$result_dir/"
          cp "$PACKAGE/work/input/toolchain/"*.txt "$result_dir/"
          cp "$PACKAGE/work/input/toolchain/"*.sha256 "$result_dir/"
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          /usr/bin/time -v -o "$result_dir/solver-time.txt" \
            timeout --signal=TERM --kill-after=30s "$SOLVER_LIMIT_SECONDS" \
            "$PACKAGE/work/input/toolchain/kissat" "$cnf" "$proof" \
            >"$result_dir/solver.out" 2>"$result_dir/solver.err"
          status=$?
          set -e
          finished="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$status" -eq 10 ]; then
            rm -f "$proof"
            raw_state=SAT_WITNESS_UNCHECKED
          elif [ "$status" -eq 20 ] && [ -s "$proof" ]; then
            raw_state=UNSAT_PROOF_UNCHECKED
          else
            rm -f "$proof"
            raw_state=UNKNOWN
          fi
          printf '%s\n' "$started" > "$result_dir/started-utc.txt"
          printf '%s\n' "$finished" > "$result_dir/finished-utc.txt"
          printf '%s\n' "$status" > "$result_dir/solver-exit-status.txt"
          printf '%s\n' "$raw_state" > "$result_dir/raw-result-state.txt"
          echo "raw_state=$raw_state" >> "$GITHUB_OUTPUT"
          echo "solver_status=$status" >> "$GITHUB_OUTPUT"
          echo "started=$started" >> "$GITHUB_OUTPUT"
          echo "finished=$finished" >> "$GITHUB_OUTPUT"

      - name: Independently check SAT coloring
        id: sat_check
        if: steps.solve.outputs.raw_state == 'SAT_WITNESS_UNCHECKED'
        run: |
          set -euo pipefail
          result_dir="$PACKAGE/work/results/$CASE_ID"
          python "$PACKAGE/verify_coloring.py" "$CASE_ID" "$result_dir/solver.out" \
            --trim-root "$PACKAGE/work/trim-input" \
            --instances "$PACKAGE/work/input/instances" \
            --output "$result_dir/checked-coloring.json" \
            | tee "$result_dir/coloring-check.out"

      - name: Independently check UNSAT proof
        id: unsat_check
        if: steps.solve.outputs.raw_state == 'UNSAT_PROOF_UNCHECKED'
        run: |
          set -euo pipefail
          result_dir="$PACKAGE/work/results/$CASE_ID"
          cnf="$PACKAGE/work/input/instances/cases/$CASE_ID/${CASE_ID}_12color.cnf"
          proof="$result_dir/${CASE_ID}.drat"
          /usr/bin/time -v -o "$result_dir/checker-time.txt" \
            timeout --signal=TERM --kill-after=30s "$CHECKER_LIMIT_SECONDS" \
            "$PACKAGE/work/input/toolchain/drat-trim" "$cnf" "$proof" \
            >"$result_dir/checker.out" 2>"$result_dir/checker.err"
          cat "$result_dir/checker.out" "$result_dir/checker.err" | tr -d '\r' \
            >"$result_dir/checker.normalized.txt"
          grep -Eq '^[[:space:]]*s VERIFIED[[:space:]]*$' "$result_dir/checker.normalized.txt"
          if grep -Eq '^[[:space:]]*s NOT VERIFIED[[:space:]]*$' "$result_dir/checker.normalized.txt"; then
            echo 'contradictory checker verdicts' >&2
            exit 1
          fi
          sha256sum "$proof" > "$result_dir/proof.sha256"
          : > "$result_dir/empty-proof.drat"
          set +e
          "$PACKAGE/work/input/toolchain/drat-trim" "$cnf" "$result_dir/empty-proof.drat" \
            >"$result_dir/negative-control.out" 2>"$result_dir/negative-control.err"
          negative_status=$?
          set -e
          printf '%s\n' "$negative_status" > "$result_dir/negative-control.exit-status.txt"
          cat "$result_dir/negative-control.out" "$result_dir/negative-control.err" | tr -d '\r' \
            >"$result_dir/negative-control.normalized.txt"
          if grep -Eq '^[[:space:]]*s VERIFIED[[:space:]]*$' "$result_dir/negative-control.normalized.txt"; then
            echo 'empty proof negative control was accepted' >&2
            exit 1
          fi
          rm -f "$result_dir/empty-proof.drat"
          gzip -1 "$proof"

      - name: Write bounded case result
        if: always()
        env:
          RAW_STATE: ${{ steps.solve.outputs.raw_state }}
          SOLVER_STATUS: ${{ steps.solve.outputs.solver_status }}
          STARTED: ${{ steps.solve.outputs.started }}
          FINISHED: ${{ steps.solve.outputs.finished }}
          SAT_OUTCOME: ${{ steps.sat_check.outcome }}
          UNSAT_OUTCOME: ${{ steps.unsat_check.outcome }}
        run: |
          set -euo pipefail
          result_dir="$PACKAGE/work/results/$CASE_ID"
          mkdir -p "$result_dir"
          state=UNKNOWN
          if ls "$result_dir"/*.drat >/dev/null 2>&1; then
            gzip -1 "$result_dir"/*.drat
          fi
          if [ "${RAW_STATE:-}" = SAT_WITNESS_UNCHECKED ] && [ "${SAT_OUTCOME:-}" = success ]; then
            state=SAT_CHECKED_COLORING
          elif [ "${RAW_STATE:-}" = UNSAT_PROOF_UNCHECKED ] && [ "${UNSAT_OUTCOME:-}" = success ]; then
            state=PROOF_CHECKED_UNSAT
          fi
          python "$PACKAGE/finalize_case.py" "$CASE_ID" "$state" \
            --case-dir "$result_dir" \
            --instance-dir "$PACKAGE/work/input/instances" \
            --solver-exit-status "${SOLVER_STATUS:-255}" \
            --started "${STARTED:-UNKNOWN}" \
            --finished "${FINISHED:-UNKNOWN}" \
            --solver-limit-seconds "$SOLVER_LIMIT_SECONDS" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --workflow-sha "${{ github.sha }}" \
            --workflow-ref "${{ github.ref }}" \
            | tee "$result_dir/finalize.out"

      - name: Upload bounded case artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.case_id }}-colorability-screen
          path: ${{ env.PACKAGE }}/work/results/${{ matrix.case_id }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  summarize:
    needs: screen
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout summary verifier
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all case artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: q00r00-s*-colorability-screen
          path: ${{ env.PACKAGE }}/work/all-results
          merge-multiple: false

      - name: Aggregate the one-sided screen
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGE/work/summary"
          python "$PACKAGE/aggregate_results.py" \
            --results "$PACKAGE/work/all-results" \
            --output "$PACKAGE/work/summary" \
            | tee "$PACKAGE/work/summary/aggregate.out"

      - name: Upload screen summary
        uses: actions/upload-artifact@v4
        with:
          name: q00r00-sixth-base-colorability-screen-summary
          path: ${{ env.PACKAGE }}/work/summary/
          if-no-files-found: error
          retention-days: 90
